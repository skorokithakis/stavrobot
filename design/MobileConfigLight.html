<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Config (mobile, light)</title>
<link rel="stylesheet" href="./sb.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap">
<style>body{margin:0}</style>
</head>
<body>
<div class="sb sb-light sb-m" style="width: 390px; height: 1100px">
<header class="sb-m-header has-back"><a class="sb-btn sb-btn-ghost sb-btn-icon sb-btn-lg" href="MobileSettings.html" aria-label="Back to settings"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"></path></svg></a><h1>Config</h1></header>
<div class="sb-m-content" style="padding-bottom: 24px; gap: 14px">
<div class="sb-callout is-warning" style="padding: 12px 14px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4 2.5 20h19z"></path><path d="M12 10v4M12 17v.5"></path></svg><div><strong>Saving restarts the bot</strong>The Signal bridge and the coder need a manual restart.</div></div>
<div class="sb-banner is-success" role="status"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 5 5 9-10"></path></svg>Saved, restarting...</div>
<div class="sb-field"><label for="toml">config.toml</label>
<textarea id="toml" class="sb-input sb-code-editor" spellcheck="false" style="height: 520px; font-size: 12.5px; padding: 12px">[bot]
name = "Stavrobot"
provider = "anthropic"
model = "claude-opus-5-5"
owner_signal = "+44 7700 900000"
owner_email = "owner@example.com"

[signal]
enabled = true

[email]
inbound = true
outbound = false
imap_host = "imap.example.com"
smtp_host = "smtp.example.com"

[telegram]
enabled = false

[coder]
enabled = true
workdir = "/data/coder"</textarea>
<span class="sb-hint">Long lines scroll sideways. The editor does not wrap lines.</span></div>
<button class="sb-btn sb-btn-primary sb-btn-lg sb-btn-block" type="button">Save and restart</button>
</div>
</div>
</body>
</html>
