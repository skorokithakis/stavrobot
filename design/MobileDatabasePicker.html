<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Table picker (mobile)</title>
<link rel="stylesheet" href="./sb.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap">
<style>body{margin:0}</style>
</head>
<body>
<div class="sb sb-dark sb-m" style="width: 390px; height: 844px">
<header class="sb-m-header"><h1>Database</h1></header>
<div class="sb-m-content" aria-hidden="true">
<div class="sb-state" style="padding-top: 80px"><div class="sb-state-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><ellipse cx="12" cy="5" rx="8" ry="3"></ellipse><path d="M4 5v14c0 1.7 3.6 3 8 3s8-1.3 8-3V5M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"></path></svg></div><strong>Choose a table</strong><p>Select a table to see its rows.</p></div>
</div>
<div class="sb-scrim"></div>
<div class="sb-sheet" role="dialog" aria-labelledby="pk" style="padding-bottom: 16px">
<div class="sb-sheet-grip"></div>
<div style="display: flex; align-items: center; justify-content: space-between"><h2 id="pk" class="sb-h2">Choose a table</h2><button class="sb-btn sb-btn-ghost sb-btn-icon sb-btn-lg" type="button" aria-label="Close" style="margin-right: -8px"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg></button></div>
<div class="sb-search"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-4-4"></path></svg><input class="sb-input sb-input-lg" type="search" aria-label="Filter tables" placeholder="Filter tables"></div>
<div class="sb-card" style="overflow: hidden" role="listbox" aria-label="Tables">
<a class="sb-list-item" href="MobileDatabase.html" role="option" aria-selected="false"><span class="sb-mono" style="flex: 1">agents</span><span class="sb-muted sb-small sb-num">9 rows</span></a>
<a class="sb-list-item" href="MobileDatabase.html" role="option" aria-selected="false"><span class="sb-mono" style="flex: 1">allowlist</span><span class="sb-muted sb-small sb-num">9 rows</span></a>
<a class="sb-list-item is-active" href="MobileDatabase.html" role="option" aria-selected="true"><span class="sb-mono" style="flex: 1">messages</span><span class="sb-muted sb-small sb-num">4,050 rows</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color: var(--accent-text)"><path d="m5 12 5 5 9-10"></path></svg></a>
<a class="sb-list-item" href="MobileDatabase.html" role="option" aria-selected="false"><span class="sb-mono" style="flex: 1">plugin_settings</span><span class="sb-muted sb-small sb-num">14 rows</span></a>
<a class="sb-list-item is-focus" href="MobileDatabase.html" role="option" aria-selected="false"><span class="sb-mono" style="flex: 1">rejected_senders</span><span class="sb-muted sb-small sb-num">3 rows</span></a>
</div>
</div>
</div>
</body>
</html>
