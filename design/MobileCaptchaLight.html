<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Signal captcha (mobile, light)</title>
<link rel="stylesheet" href="./sb.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap">
<style>body{margin:0}</style>
</head>
<body>
<div class="sb sb-light" style="width: 390px; height: 1000px; padding: 32px 16px; display: flex; flex-direction: column; gap: 20px">
<div class="sb-brand" style="padding: 0; justify-content: center"><div class="sb-logo"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="7" width="16" height="12" rx="3"></rect><path d="M12 7V4"></path><circle cx="9" cy="13" r="1" fill="currentColor"></circle><circle cx="15" cy="13" r="1" fill="currentColor"></circle></svg></div>Stavrobot</div>
<main class="sb-card" aria-labelledby="ct">
<div style="padding: 20px 20px 4px"><span class="sb-label">Signal</span><h1 id="ct" style="margin: 4px 0 6px; font-size: 20px; font-weight: 600">Solve the Signal captcha</h1><p class="sb-muted" style="margin: 0; font-size: 14px">Signal asks for a captcha before it links the bot's number.</p></div>
<form style="padding: 16px 20px 20px; display: flex; flex-direction: column; gap: 16px" aria-labelledby="ct">
<ol class="sb-steps">
<li><div style="display: flex; flex-direction: column; gap: 8px; flex: 1"><span>Open the captcha page.</span><a class="sb-btn sb-btn-secondary sb-btn-lg sb-btn-block" href="#" target="_blank" rel="noopener">signalcaptchas.org<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"></path></svg></a></div></li>
<li>Solve the captcha.</li>
<li>Long-press "Open Signal" and copy the link.</li>
<li><div style="display: flex; flex-direction: column; gap: 8px; flex: 1"><label for="cap" style="font-size: 14px">Paste the value here</label><textarea id="cap" class="sb-input sb-textarea sb-mono" spellcheck="false" style="min-height: 120px; font-size: 12.5px">signalcaptcha://signal-hcaptcha.5fad97ac-7d06-4e44-b18a-b950b20148ff.registration.P1_eyJ0eXAiOiJKV1Qi</textarea></div></li>
</ol>
<div class="sb-banner is-error" role="alert"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 8v5M12 16v.5"></path></svg>Signal rejected the captcha: it has expired. Solve a new one.</div>
<button class="sb-btn sb-btn-primary sb-btn-lg sb-btn-block" type="button">Submit</button>
</form>
</main>
</div>
</body>
</html>
