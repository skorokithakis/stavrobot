# Valid providers: amazon-bedrock, ant-ling, anthropic, azure, baseten,
# cerebras, cloudflare-ai-gateway, cloudflare-workers-ai, deepseek, fireworks,
# github-copilot, google, google-vertex, groq, huggingface, kimi-coding, meta,
# minimax, minimax-cn, mistral, moonshotai, moonshotai-cn, nvidia, openai,
# openai-codex, opencode, opencode-go, openrouter, qwen-token-plan,
# qwen-token-plan-cn, qwen-token-plan-individual, radius, together, typesafe,
# vercel-ai-gateway, xai, xiaomi, xiaomi-token-plan-ams, xiaomi-token-plan-cn,
# xiaomi-token-plan-sgp, zai, zai-coding-cn.
provider = "anthropic"
model = "claude-opus-5-5"

# Thinking level for the main agent. Known values: "low", "medium", "high", "xhigh".
# Defaults to "high" when omitted.
# thinkingLevel = "high"

# Password for HTTP Basic Auth. All endpoints except webhooks require this.
# Change this to something secure. Required: the app refuses to start without it.
password = "change-me"

# Authentication: use exactly one of apiKey or authFile.
# apiKey: a static Anthropic API key.
# authFile: path to an auth.json with OAuth credentials (for Claude Pro/Max
#   subscriptions). Generate it by running `npx @earendil-works/pi-coding-agent`,
#   then using the /login command and choosing "Anthropic".
# apiKey = "your-api-key-here"
authFile = "/app/data/auth.json"

# Custom endpoint configuration. Use this to point the bot at a local model
# server (e.g. Ollama) or an Anthropic-compatible proxy instead of the default
# provider. When baseUrl is set, apiKey is required and authFile is forbidden.
# contextWindow and maxTokens are also required. api defaults to
# "openai-completions" if omitted.
#
# reasoning is opt-in and defaults to false. Set it to true only for models that
# support thinking, which is what makes thinkingLevel apply on a custom endpoint.
# Leave it off for non-thinking models, since some servers reject reasoning_effort.
#
# Example: Ollama running locally
# provider = "openai"
# model = "llama3.2"
# apiKey = "ollama"
# baseUrl = "http://localhost:11434/v1"
# contextWindow = 128000
# maxTokens = 8192
# api = "openai-completions"
#
# Example: Ollama Cloud. Available model names are listed at
# https://ollama.com/api/tags.
# provider = "openai"
# model = "gpt-oss:120b"
# apiKey = "your-ollama-api-key"
# baseUrl = "https://ollama.com/v1"
# contextWindow = 128000
# maxTokens = 8192
# api = "openai-completions"
# reasoning = true
#
# Example: Anthropic-compatible proxy
# provider = "anthropic"
# model = "claude-opus-5-5"
# apiKey = "your-proxy-key"
# baseUrl = "https://proxy.example.com"
# contextWindow = 200000
# maxTokens = 8192
# api = "anthropic-messages"


# The public HTTPS URL where this server is reachable (no trailing slash).
publicHostname = "https://example.com"

# Maximum context size in thousands of tokens. Defaults to 50 (50k tokens), capped at
# the model's full context window. Average token usage is roughly half this value due
# to the compaction sawtooth. Reduce to lower API costs; increase (up to the model
# limit) to keep more history.
# contextTokensK = 100

# Optional additional instructions appended to the base system prompt.
# The base prompt is in system-prompt.txt and always applies.
customPrompt = """
I prefer a dry wit and an even tone. Avoid excessive emojis and cheerful language. Use
normal dashes rather than en- or em-dashes. Don't end messages with a full stop, it's
too formal.
"""

# The owner of this bot. Used to seed the owner interlocutor record on startup.
# name is required. signal, telegram, whatsapp, and email are the owner's personal
# numbers/IDs/addresses — the ones the owner messages the bot from (not the bot's
# own numbers). Include whichever channels the owner uses.
[owner]
name = "Stavros"
# signal accepts a phone number or a UUID. Use the UUID if phone number privacy is
# enabled on your Signal account, since signal-cli then reports your number as a UUID.
# signal = "+1234567890"
# signal = "01234567-89ab-cdef-0123-456789abcdef"
# telegram = "123456789"
# whatsapp = "+1234567890"
# email = "owner@example.com"          # specific address
# email = "*@example.com"              # any address at this domain
# email = "myuser+*@gmail.com"         # any plus-tag for this user

# Signal integration. account is the bot's phone number (registered with
# signal-cli — must be a separate number from the owner's).
# The allowlist of numbers permitted to message the agent is managed via the
# /settings web UI and stored in allowlist.json (not in this file).
[signal]
account = "+1234567890"

# Telegram integration. Create a bot via @BotFather on Telegram to get a token.
# To find your chat ID, message @userinfobot on Telegram.
# Stavrobot long-polls Telegram for updates on startup, so Telegram needs no
# publicly reachable endpoint or webhook. The top-level publicHostname setting is
# still required for links the bot sends (login, pages).
# The allowlist of chat IDs permitted to message the agent is managed via the
# /settings web UI and stored in allowlist.json (not in this file).
[telegram]
botToken = "123456:ABC-DEF1234ghIkl-zyx57W2v1u123ew11"

# WhatsApp integration.
# Uncomment the section header to enable. On first start, a QR code will appear
# in the app logs — scan it with WhatsApp to link as a companion device.
# Note: uses an unofficial library. Risk of account ban or protocol breakage.
# The allowlist of numbers permitted to message the agent is managed via the
# /settings web UI and stored in allowlist.json (not in this file).
# [whatsapp]

# Email integration. Inbound email arrives via a Cloudflare Email Worker that
# posts to /email/webhook. Outbound email is sent via SMTP.
#
# Setup:
#   1. Add this section to config.toml with your SMTP credentials and a random
#      webhookSecret (e.g. `openssl rand -hex 32`).
#   2. Deploy the Cloudflare Email Worker below to your Cloudflare account.
#   3. In the worker, set the environment variables WEBHOOK_URL and WEBHOOK_SECRET
#      (via `wrangler secret put` or the Cloudflare dashboard):
#        WEBHOOK_URL    = https://<publicHostname>/email/webhook
#        WEBHOOK_SECRET = <the same value as webhookSecret below>
#   4. In Cloudflare Email Routing, add a routing rule that forwards inbound mail
#      to the worker.
#   5. Add allowed sender addresses via the /settings web UI. The local part
#      (before @) supports * as a glob wildcard, e.g. *@example.com or
#      myuser+*@gmail.com.
#
# Cloudflare Email Worker code (create a new Worker and paste this):
#
#   export default {
#     async email(message, env, ctx) {
#       const rawEmail = await new Response(message.raw).text();
#       const response = await fetch(env.WEBHOOK_URL, {
#         method: "POST",
#         headers: {
#           "Content-Type": "application/json",
#           "Authorization": "Bearer " + env.WEBHOOK_SECRET,
#         },
#         body: JSON.stringify({
#           from: message.from,
#           to: message.to,
#           raw: rawEmail,
#         }),
#       });
#       if (!response.ok) {
#         message.setReject(`Webhook returned ${response.status}`);
#       }
#     },
#   };
#
# [email]
# Required for inbound email (webhook):
# webhookSecret = "your-random-secret"
#
# Required for outbound email (SMTP) — omit these if you only need inbound:
# smtpHost = "smtp.example.com"
# smtpPort = 587
# smtpUser = "bot@example.com"
# smtpPassword = "your-smtp-password"
# fromAddress = "bot@example.com"

# Enables the self-programming coder agent. Uses Claude Code headless. The model
# must be a Claude Code alias: "sonnet", "opus", or "haiku". This section also
# requires enabling the "coder" Docker Compose profile (see README for details).
# By default the coder uses the subscription OAuth login (see README). To use an
# Anthropic-compatible API endpoint instead, set both keys below; they are passed
# to Claude Code as ANTHROPIC_API_KEY / ANTHROPIC_BASE_URL. Setting only one of
# the two is a startup error. The top-level apiKey/baseUrl never affect the coder.
[coder]
model = "opus"
# apiKey = "your-anthropic-api-key-here"
# baseUrl = "https://api.anthropic.com"

# Optional OpenAI embeddings support. When present, the bot generates vector
# embeddings for semantic search. This improves recall (finding relevant
# messages that don't share exact keywords) at the cost of ~300ms extra latency
# per search. Without embeddings, search falls back to full-text only.
# [embeddings]
# apiKey = "your-openai-api-key-here"

